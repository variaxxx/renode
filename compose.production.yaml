name: renode

x-backend: &backend
  image: ${BACKEND_IMAGE:-renode-backend:local}
  build:
    context: .
    target: backend
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db and port 5432}
    FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    HOST: 0.0.0.0
  restart: unless-stopped
  init: true
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ['bun', 'run', 'db:migrate:deploy']
    restart: 'no'
  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: ['bun', 'run', 'start:worker']
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    image: ${WEB_IMAGE:-renode-web:local}
    build:
      context: .
      target: web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
